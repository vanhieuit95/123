<!DOCTYPE html>
<html lang="vi">
 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập hệ thống</title>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
 
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f4f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
 
    .card {
      background: #ffffff;
      border: 1px solid #e0dfd8;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
 
    .title {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
    }
 
    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 1.5rem;
    }
 
    .btn-load {
      width: 100%;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 500;
      color: #444;
      background: #f4f4f0;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background .15s;
    }
 
    .btn-load:hover {
      background: #eaeae6;
    }
 
    .btn-load:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
 
    .captcha-wrap {
      background: #f9f9f7;
      border: 1px dashed #d0d0c8;
      border-radius: 8px;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
 
    .captcha-wrap img {
      max-width: 100%;
      display: block;
    }
 
    .placeholder {
      font-size: 13px;
      color: #aaa;
    }
 
    .field {
      margin-bottom: 12px;
    }
 
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #666;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
 
    .field input {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      color: #1a1a1a;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
 
    .field input:focus {
      border-color: #aaa;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, .06);
    }
 
    .divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 1rem 0;
    }
 
    .loading {
      display: none;
      font-size: 13px;
      color: #888;
      text-align: center;
      padding: 8px 0;
    }
 
    .spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 2px solid #ddd;
      border-top-color: #555;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
 
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
 
    .btn-submit {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #222;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, transform .1s;
      margin-top: 4px;
    }
 
    .btn-submit:hover {
      background: #444;
    }
 
    .btn-submit:active {
      transform: scale(.98);
    }
</style>
</head>
 
<body>
<div class="card">
<p class="title">Đăng nhập hệ thống</p>
<p class="subtitle">Nhấn "Tải captcha" để bắt đầu</p>
 
    <button class="btn-load" onclick="login()" id="loadBtn">Tải captcha</button>
 
    <div class="captcha-wrap">
<span class="placeholder" id="captchaPlaceholder">Chưa có captcha</span>
<img id="captchaImg" style="display:none">
</div>
 
    <div class="field">
<label>Tên đăng nhập</label>
<input id="username" placeholder="Nhập username" autocomplete="off">
</div>
<div class="field">
<label>Mật khẩu</label>
<input id="password" placeholder="Nhập mật khẩu" type="password">
</div>
<div class="field">
<label>Captcha</label>
<input id="captcha" placeholder="Nhập mã captcha">
</div>
 
    <hr class="divider">
 
    <div class="loading" id="loading">
<span class="spinner"></span>Đang xử lý...
</div>
 
    <button class="btn-submit" onclick="submitLogin()">Đăng nhập</button>
<button class="btn-load" onclick="repeatLogin()" id="repeatBtn" style="margin-top:8px;">
      Submit lại form thứ 3/5
</button>
</div>
 
  <script>
    const BASE_URL = "https://yarn-washroom-tiling.ngrok-free.dev";
    const HEADERS = {
      "Content-Type": "application/json",
      "ngrok-skip-browser-warning": "true"
    };
 
    function setLoading(on) {
      document.getElementById("loading").style.display = on ? "block" : "none";
    }
 
    async function login() {
      const btn = document.getElementById("loadBtn");
      btn.textContent = "Đang tải...";
      btn.disabled = true;
      try {
        const res = await fetch(`${BASE_URL}/start-login`, { headers: HEADERS });
        const data = await res.json();
        const img = document.getElementById("captchaImg");
        img.src = data.image;
        img.style.display = "block";
        document.getElementById("captchaPlaceholder").style.display = "none";
        btn.textContent = "Tải lại captcha";
      } catch (e) {
        btn.textContent = "Lỗi — thử lại";
      } finally {
        btn.disabled = false;
      }
    }
 
    async function submitLogin() {
      setLoading(true);
      try {
        const res = await fetch(`${BASE_URL}/submit-login`, {
          method: "POST",
          headers: HEADERS,
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
            captcha: document.getElementById("captcha").value
          })
        });
        const data = await res.json();
        const img = document.getElementById("captchaImg");
        img.src = data.image;
        img.style.display = "block";
        document.getElementById("captchaPlaceholder").style.display = "none";
      } finally {
        setLoading(false);
      }
    }
 
    async function repeatLogin() {
      setLoading(true);
      try {
        const res = await fetch(`${BASE_URL}/repeat-login`, {
          method: "POST",
          headers: HEADERS,
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        });
        const data = await res.json();
        if (data.error) {
          alert("Lỗi: " + data.error);
          return;
        }
        const img = document.getElementById("captchaImg");
        img.src = data.image;
        img.style.display = "block";
        document.getElementById("captchaPlaceholder").style.display = "none";
      } finally {
        setLoading(false);
      }
    }
</script>
</body>
 
</html>
